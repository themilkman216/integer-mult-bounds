name: Registered research packages
on:
  # Declared package inputs may live anywhere in the repository. Always plan;
  # the manifest-aware selector keeps unrelated changes out of replay jobs.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Git base for affected-package selection (use all-zero SHA to select all)
        default: HEAD^
        required: true
permissions:
  contents: read
concurrency:
  group: research-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Onboarding helper tests
        run: python -B -m unittest discover -s tests -p 'test_research_*.py' -v
      - id: plan
        name: Select changed packages and declared input dependents
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: python -B scripts/research_package.py --changed-since "$REVIEW_BASE" --github-output "$GITHUB_OUTPUT"
  replay:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESEARCH_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Explicit bounded package replay
        run: python -B scripts/research_package.py --package "$RESEARCH_PACKAGE" --install-deps
      - name: Committed inputs remain unchanged
        run: git diff --exit-code
